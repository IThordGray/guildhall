name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1-stable

# Naming bash adds pipefail (the default is bash -e), so `godot ... | tee` fails when godot does.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot
        run: |
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/SHA512-SUMS.txt"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/$zip"
          awk -v f="$zip" '$2 == f' SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot

      - name: Cache export templates
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates
          # Names the templates kept below; change it when that list changes.
          key: godot-templates-${{ env.GODOT_VERSION }}-web_nothreads_release-android_debug

      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          tpz="Godot_v${GODOT_VERSION}_export_templates.tpz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/$tpz"
          awk -v f="$tpz" '$2 == f' SHA512-SUMS.txt | sha512sum -c -
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$dest"
          # Only the two templates the presets use: the full archive is over 1 GB.
          unzip -j "$tpz" templates/web_nothreads_release.zip templates/android_debug.apk -d "$dest"

      - name: Import
        run: godot --headless --path . --import

      - name: Test
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://test -gexit -gdisable_colors | tee "$RUNNER_TEMP/gut.log"
          # GUT exits 0 having run nothing when the import is incomplete.
          grep -Eq '^Tests +[1-9]' "$RUNNER_TEMP/gut.log"

      - name: Stamp commit SHA
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sed -i "/^\[application\]$/a config/version=\"$SHA\"" project.godot
          grep -Fx "config/version=\"$SHA\"" project.godot

      - name: Export web
        run: |
          mkdir -p build/web
          # Keeps the web build out of the Android export's import scan and pack.
          touch build/.gdignore
          # On failure, the log tail becomes an annotation: job logs need sign-in, annotations don't.
          if ! godot --headless --export-release "Web" build/web/index.html 2>&1 | tee "$RUNNER_TEMP/export.log"; then
            echo "::error title=Export web::$(sed 's/\x1b\[[0-9;]*m//g; /^\[ *\(DONE\|[0-9]*%\) \]/d; /^\s*$/d; s/%/%25/g; s/\r/%0D/g' "$RUNNER_TEMP/export.log" | tail -n 30 | sed -z 's/\n/%0A/g')"
            exit 1
          fi

      - name: Export Android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            base64 -d <<< "$KEYSTORE_B64" > "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          else
            # A throwaway key: this APK will not install over one signed with another key.
            keytool -genkeypair -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          mkdir -p build/android
          if ! godot --headless --export-debug "Android" build/android/guildhall.apk 2>&1 | tee "$RUNNER_TEMP/export.log"; then
            echo "::error title=Export Android::$(sed 's/\x1b\[[0-9;]*m//g; /^\[ *\(DONE\|[0-9]*%\) \]/d; /^\s*$/d; s/%/%25/g; s/\r/%0D/g' "$RUNNER_TEMP/export.log" | tail -n 30 | sed -z 's/\n/%0A/g')"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: guildhall-apk
          path: build/android/guildhall.apk
          if-no-files-found: error

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
